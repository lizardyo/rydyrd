name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack project
        run: unzip -q RobertsBuildingPack-NeoForge-1.21.1-source.zip -d project
      - name: Build
        working-directory: project/RobertsBuildingPack-NeoForge-1.21.1-source
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Error summary
        if: failure()
        run: |
          echo '### Build errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|What went wrong|FAILED|Could not" -A3 build.log | head -200 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RobertsBuildingPack-NeoForge-1.21.1
          path: project/RobertsBuildingPack-NeoForge-1.21.1-source/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
